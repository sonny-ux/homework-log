<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
/* Mondrian: white ground, heavy black rules, red / blue / yellow / black / grey blocks, one per class. */
:root {
  --ink: #241f1a; --paper: #fbf7ee; --off: #f3ecdc; --muted: #8b6f52; --rule: 1.5px; --thin: 1px; --gridline: #efe5d0; --onc: #fbf7ee;
  --red: #c4473a; --blue: #2f5f9e; --yellow: #e9c45a; --black: #3d7a55; --grey: #f0e6c8;
  --sans: 'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #cbbd9b; --paper: #000000; --off: #120f0a; --muted: #b19d78; --gridline: #1d1912; --onc: #f6efdf;
    --red: #c25a4c; --blue: #4d77b3; --yellow: #d9b65a; --black: #4f8f69; --grey: #f3ead3; color-scheme: dark; }
  html, body { color: #f3ecdc; }
  .c-Lit-Study { color: #f6efdf !important; }
  .c-Phil-of-Sci, .c-Woolf { color: #1b1a18 !important; }
  nav.seg a { color: #f3ecdc; }
  nav.seg a.on { background: #f3ecdc; color: #000; }
  .arrows button { color: #f3ecdc; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
body { padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
main { max-width: 900px; margin: 0 auto; }
.frame { border: var(--rule) solid var(--ink); }
.bar { display: grid; grid-template-columns: 1fr auto auto; align-items: stretch; border: var(--rule) solid var(--ink); }
.bar h1 { font-size: 22px; font-weight: 600; letter-spacing: .02em; padding: 10px 14px; }
.bar .date { padding: 10px 14px; border-left: var(--rule) solid var(--ink); font-weight: 500; display: flex; align-items: center; }
.bar .flag { width: 46px; background: var(--red); border-left: var(--rule) solid var(--ink); }
nav.seg { display: grid; grid-template-columns: repeat(5, 1fr); border: var(--rule) solid var(--ink); border-top: none; position: sticky; top: 0; z-index: 5; background: var(--paper); }
nav.seg a { text-align: center; padding: 10px 4px; font-weight: 500; color: var(--ink); text-decoration: none; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
nav.seg a + a { border-left: var(--rule) solid var(--ink); }
nav.seg a.on { background: var(--ink); color: var(--paper); }
section { margin-top: 22px; scroll-margin-top: 60px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); font-size: 14px; }
.c-Topology { background: var(--red); color: var(--onc); }
.c-Physics-III { background: var(--blue); color: var(--onc); }
.c-Phil-of-Sci { background: var(--yellow); color: var(--ink); }
.c-Lit-Study { background: var(--black); color: var(--onc); }
.c-Woolf { background: var(--grey); color: var(--ink); }
.c-other { background: var(--off); color: var(--ink); }

/* Today band */
.band { display: flex; height: 92px; border: var(--rule) solid var(--ink); }
.band .blk { position: relative; min-width: 6px; }
.band .blk + .blk, .band .tot { border-left: var(--rule) solid var(--ink); }
.band .tot { flex: 0 0 auto; min-width: 110px; padding: 10px 14px; background: var(--paper); display: flex; flex-direction: column; justify-content: center; }
.band .tot b { font-size: 26px; line-height: 1; }
.band .tot span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
.band .empty { flex: 1; display: flex; align-items: center; padding: 0 14px; color: var(--muted); }
.list { border: var(--rule) solid var(--ink); border-top: none; }
.row { display: grid; grid-template-columns: 18px 1fr auto; align-items: stretch; }
.row + .row { border-top: var(--thin) solid var(--ink); }
.row .sw { border-right: var(--thin) solid var(--ink); }
.row .t { padding: 8px 12px; }
.row .t small { color: var(--muted); }
.row .m { padding: 8px 12px; font-weight: 600; border-left: var(--thin) solid var(--ink); white-space: nowrap; display: flex; align-items: center; }

/* Week grid */
.wkhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.wkhead h2 { margin: 0; }
.arrows { display: flex; border: var(--thin) solid var(--ink); }
.arrows button { background: var(--paper); border: none; font: 700 16px var(--sans); padding: 4px 14px; cursor: pointer; color: var(--ink); }
.arrows button + button { border-left: var(--thin) solid var(--ink); }
.arrows button:active { background: var(--yellow); }
.week { display: grid; grid-template-columns: 34px repeat(7, 1fr); border: var(--rule) solid var(--ink); }
.week .dh { border-left: var(--rule) solid var(--ink); border-bottom: var(--rule) solid var(--ink); padding: 6px 4px; text-align: center; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; line-height: 1.2; }
.week .dh small { display: block; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.week .dh.today { background: var(--yellow); }
.week .dh.today small { color: var(--ink); }
.week .corner { border-bottom: var(--rule) solid var(--ink); }
.week .axis { position: relative; }
.week .axis span { position: absolute; right: 4px; font-size: 10px; color: var(--muted); transform: translateY(-50%); }
.week .col { position: relative; border-left: var(--rule) solid var(--ink); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hr) - 1px), var(--gridline) calc(var(--hr) - 1px), var(--gridline) var(--hr)); }
.week .s { position: absolute; left: 0; right: 0; border-top: var(--thin) solid var(--ink); border-bottom: var(--thin) solid var(--ink); font-size: 10px; font-weight: 600; padding: 2px 3px; overflow: hidden; line-height: 1.15; }
.week .foot { border-left: var(--rule) solid var(--ink); border-top: var(--rule) solid var(--ink); text-align: center; padding: 6px 2px; font-size: 12px; font-weight: 600; }
.week .foot.first { border-left: none; }

/* By class composition */
.comp { position: relative; height: 260px; border: var(--rule) solid var(--ink); background: var(--paper); }
.comp .r { position: absolute; outline: var(--rule) solid var(--ink); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; overflow: hidden; }
.comp .r b { font-size: 20px; line-height: 1.05; }
.comp .r span { font-size: 12px; font-weight: 500; }
.zero { margin-top: 8px; font-size: 14px; color: var(--muted); }
.zero b { color: var(--ink); }

/* Assignments: one simple queue, grouped Late / This week / Later */
.grp { margin-top: 14px; }
.grp:first-child { margin-top: 0; }
.gh { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; padding: 0 0 6px; }
.gh span { letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--muted); }
.as { border: var(--rule) solid var(--ink); }
.a { display: grid; grid-template-columns: 16px 1fr 148px; align-items: stretch; }
.a + .a { border-top: var(--thin) solid var(--ink); }
.a .sw { border-right: var(--thin) solid var(--ink); }
.a .ti { padding: 10px 12px; font-weight: 500; }
.a .ti small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.a .when { border-left: var(--thin) solid var(--ink); padding: 8px 12px; text-align: right; display: flex; flex-direction: column; justify-content: center; }
.a .when b { font-size: 15px; }
.a .when small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.a.soon .when { box-shadow: inset 4px 0 0 var(--yellow); }
.a.over .when { color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
.a.over .when small { color: var(--muted); }
.late .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.a.done .ti, .a.done .when { color: var(--muted); }
details.donebox { margin-top: 14px; }
details.donebox summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; padding: 4px 0; }
.updated { margin-top: 26px; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .a { grid-template-columns: 12px 1fr 116px; }
  .a .when { padding: 8px 9px; }
  .a .when b { font-size: 14px; }
  .a .ti { padding: 9px 10px; }
  .week { grid-template-columns: 26px repeat(7, 1fr); }
  .week .dh { font-size: 10px; padding: 5px 1px; letter-spacing: 0; }
  .week .s { font-size: 9px; padding: 1px 2px; }
  .comp { height: 220px; }
  .bar h1 { font-size: 20px; }
  :root { --rule: 1.5px; }
}
.comp .r b.sm { font-size: 14px; }
.comp .r { padding: 6px 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .chip i { width: 12px; height: 12px; display: inline-block; outline: 1.5px solid var(--ink); flex: 0 0 auto; }
.week .duelab { border-bottom: var(--thin) solid var(--ink); font-size: 9px; text-transform: uppercase; color: var(--muted); padding: 4px 2px; text-align: right; }
.week .duecell { border-left: var(--rule) solid var(--ink); border-bottom: var(--thin) solid var(--ink); padding: 3px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.chip { display: flex; align-items: flex-start; gap: 4px; font-size: 10px; font-weight: 600; line-height: 1.15; overflow: hidden; hyphens: auto; -webkit-hyphens: auto; }
.chip i { margin-top: 2px; }
.chip i { width: 8px; height: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: var(--rule) solid var(--ink); margin-bottom: 14px; }
.cal .ch { font-size: 11px; font-weight: 600; text-transform: uppercase; text-align: center; padding: 4px 0; border-bottom: var(--thin) solid var(--ink); }
.cal .ch:not(:nth-child(7n+1)), .cal .cd:not(:nth-child(7n+1)) { border-left: var(--thin) solid var(--ink); }
.cal .cd { min-height: 74px; padding: 4px; border-top: var(--thin) solid var(--ink); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal .cd:nth-child(-n+14) { border-top: none; }
.cal .cd .n { font-size: 12px; font-weight: 600; }
.cal .cd.today { box-shadow: inset 0 0 0 3px var(--yellow); }
.cal .cd.past { opacity: .5; }
.cal .ci { font-size: 11px; font-weight: 600; padding: 3px 4px; line-height: 1.15; hyphens: auto; -webkit-hyphens: auto; overflow: hidden; }
.cal .ci small { font-weight: 500; opacity: .85; }
@media (max-width: 560px) { .cal .cd { min-height: 64px; padding: 3px 2px; } .cal .ci { font-size: 9.5px; padding: 2px 3px; } .chip { font-size: 8.5px; } }
.noticed { border: var(--rule) solid var(--ink); padding: 4px 14px; }
.noticed p { padding: 9px 0; font-size: 15px; line-height: 1.45; }
.noticed p + p { border-top: var(--thin) solid var(--ink); }
.noticed .nz { color: var(--muted); }
.topics { border: var(--rule) solid var(--ink); }
.tg + .tg { border-top: var(--rule) solid var(--ink); }
.th { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 8px 12px; border-bottom: var(--thin) solid var(--ink); }
.th i { width: 14px; height: 14px; outline: 1.5px solid var(--ink); }
.tr { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 12px; font-size: 14px; line-height: 1.4; }
.tr + .tr { border-top: var(--thin) dashed var(--gridline); }
.tr .td { color: var(--muted); font-size: 12px; padding-top: 2px; }
.row .t .tp { font-size: 13px; color: var(--muted); margin-top: 2px; }
@media (max-width: 560px) { .tr { grid-template-columns: 72px 1fr; } }
.fc { border: var(--rule) solid var(--ink); margin-bottom: 14px; }
.fsum { padding: 10px 12px; border-bottom: var(--thin) solid var(--ink); font-size: 15px; }
.fsum b { font-size: 18px; }
.fr { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; }
.fr + .fr { border-top: var(--thin) solid var(--ink); }
.fr i { width: 14px; height: 14px; outline: 1.5px solid var(--ink); }
.ft { font-weight: 500; font-size: 15px; } .ft small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.fl { font-weight: 600; white-space: nowrap; }
.fnote { font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: var(--thin) solid var(--ink); }
.trends { border: var(--rule) solid var(--ink); padding: 4px 14px 6px; }
.trends p { padding: 7px 0; font-size: 14px; border-top: var(--thin) solid var(--ink); }
.tbars { display: flex; gap: 8px; align-items: flex-end; height: 150px; padding: 10px 0 6px; }
.tb { flex: 1; display: flex; flex-direction: column; align-items: stretch; height: 100%; min-width: 0; }
.tb .stack { flex: 1; display: flex; flex-direction: column-reverse; outline: var(--thin) solid var(--ink); }
.tb .stack div + div { border-bottom: var(--thin) solid var(--ink); }
.tb .tv { font-size: 11px; font-weight: 600; text-align: center; margin-top: 4px; }
.tb .tw { font-size: 11px; color: var(--muted); text-align: center; }
.tb.cur .tw { color: inherit; font-weight: 600; }
.tb .stack .fade { opacity: .28; }
.tb .tv small { font-weight: 500; color: var(--muted); }
.trends .tnote { color: var(--muted); font-size: 13px; }
.tr b { font-weight: 600; }
.wktools { display: flex; gap: 8px; }
.arrows button.on { background: var(--ink); color: var(--paper); }
.rng button { font-size: 13px; padding: 4px 10px; }
.hl { border: var(--rule) solid var(--ink); border-left: 10px solid var(--red); padding: 10px 12px; margin-bottom: 12px; font-weight: 500; font-size: 15px; }
.hl span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { border: var(--rule) solid var(--ink); padding: 10px 12px 12px; }
.ct { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--muted); }
.cbig { font-size: 28px; font-weight: 600; margin-top: 2px; } .cbig small { font-size: 13px; font-weight: 500; color: var(--muted); }
.cn { font-size: 14px; margin: 4px 0 8px; }
.hbars { position: relative; height: 90px; display: flex; align-items: flex-end; gap: 2px; border-bottom: var(--thin) solid var(--ink); }
.hb { flex: 1; height: 100%; display: flex; align-items: flex-end; } .hb div { width: 100%; background: var(--muted); opacity: .45; }
.hb.in div { background: var(--blue); opacity: 1; } .hb.fut div { opacity: 0; }
.avgline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink); } .avgline span { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--muted); }
.hdots { position: relative; height: 80px; display: flex; gap: 2px; border-bottom: var(--thin) solid var(--ink); border-top: var(--thin) dashed var(--gridline); }
.hd { flex: 1; position: relative; } .hd i { position: absolute; left: 50%; width: 9px; height: 9px; margin: 0 0 -4px -4px; border-radius: 50%; background: var(--muted); }
.hd.in i { background: var(--red); outline: 1.5px solid var(--ink); }
.hdots .top, .hdots .bot { position: absolute; left: 0; font-size: 10px; color: var(--muted); } .hdots .top { top: -14px; } .hdots .bot { bottom: -14px; }
.hcons { display: flex; gap: 5px; } .hcons i { width: 18px; height: 18px; outline: var(--thin) solid var(--ink); } .hcons i.on { background: var(--blue); }
.hbal .hr { display: grid; grid-template-columns: 44px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
.hbal .bar { position: relative; height: 12px; outline: var(--thin) solid var(--ink); } .hbal .bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.hbal .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); } .hbal em { font-style: normal; text-align: right; }
.hbal .hk { font-size: 10px; color: var(--muted); margin-top: 4px; }
[data-day] { cursor: pointer; }
.a .about { display: none; font-weight: 400; font-size: 13px; margin-top: 6px; line-height: 1.4; }
.a.open .about { display: block; }
.sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.sheetbg.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 105%); width: min(640px, 100%); max-height: 78vh; overflow-y: auto; background: var(--paper); border: var(--rule) solid var(--ink); border-bottom: none; z-index: 31; padding: 0 16px max(18px, env(safe-area-inset-bottom)); transition: transform .25s; }
.sheet.on { transform: translate(-50%, 0); }
.sh { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 8px; position: sticky; top: 0; background: var(--paper); font-size: 19px; }
.sx { background: none; border: none; color: inherit; font-size: 26px; cursor: pointer; line-height: 1; }
.sg { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.si { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 8px 0; border-top: var(--thin) solid var(--ink); }
.si i { width: 14px; height: 14px; margin-top: 4px; outline: 1.5px solid var(--ink); }
.si small { color: var(--muted); } .si p { font-size: 14px; margin-top: 4px; line-height: 1.4; } .si p.sm { color: var(--muted); font-size: 13px; }
.sheet .none { color: var(--muted); font-size: 14px; padding: 4px 0; }
.plan { border: var(--rule) solid var(--ink); }
.pl { display: grid; grid-template-columns: 20px 14px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; }
.pl + .pl { border-top: var(--thin) solid var(--ink); }
.pl .pn { font-weight: 600; color: var(--muted); } .pl i { width: 14px; height: 14px; outline: 1.5px solid var(--ink); }
.pl small { color: var(--muted); } .pl p { font-size: 13px; color: var(--muted); margin-top: 2px; } .pl .pm { font-weight: 600; }
.plan .tip { border-top: var(--thin) solid var(--ink); padding: 8px 12px; font-size: 13px; }
.subnav { display: flex; gap: 0; margin-bottom: 12px; border: var(--thin) solid var(--ink); width: max-content; }
.subnav a { padding: 5px 14px; font-size: 13px; font-weight: 500; color: inherit; text-decoration: none; }
.subnav a + a { border-left: var(--thin) solid var(--ink); }
.part { margin-top: 22px; padding-top: 16px; border-top: var(--rule) solid var(--ink); scroll-margin-top: 60px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: var(--rule) solid var(--ink); padding: 12px; color: inherit; text-decoration: none; min-height: 110px; display: flex; flex-direction: column; }
.tile.wide { grid-column: 1 / -1; min-height: 0; }
.tile.accent { border-left: 10px solid var(--red); }
.tl { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--muted); }
.tb { font-size: 38px; font-weight: 600; line-height: 1.1; margin-top: auto; }
.tm { font-size: 17px; font-weight: 500; margin-top: 8px; line-height: 1.3; } .tm small { color: var(--muted); font-weight: 500; }
.mbar { display: flex; height: 10px; margin-top: 8px; outline: var(--thin) solid var(--ink); } .mbar i { display: block; }
.strip { display: flex; gap: 6px; margin-top: 8px; height: 80px; }
.sd { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; outline: var(--thin) solid var(--ink); position: relative; }
.sd em { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; font-style: normal; color: var(--muted); }
.strip { margin-bottom: 16px; } .sd.now { outline: 3px solid var(--yellow); }
.sd span { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.dl { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; font-weight: 500; }
.dl i { width: 12px; height: 12px; outline: 1.5px solid var(--ink); } .dl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

b, strong { font-weight: 600; }
html, body { font-weight: 400; }
@media (prefers-color-scheme: dark) { .c-Phil-of-Sci, .c-Woolf { color: #000 !important; } }
.bar .flag.pixbox { width: 64px; padding: 0; background: #1c2540; display: flex; align-items: stretch; }
.pix { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.pix .es { opacity: 0; animation: blink 5s steps(1) infinite; } .pix .eo { animation: blinkO 5s steps(1) infinite; }
@keyframes blink { 0%, 93% { opacity: 0; } 94%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes blinkO { 0%, 93% { opacity: 1; } 94%, 97% { opacity: 0; } 98%, 100% { opacity: 1; } }
.pix .pt { opacity: 0; animation: page 9s steps(1) infinite; }
@keyframes page { 0%, 88% { opacity: 0; } 89%, 93% { opacity: 1; } 94%, 100% { opacity: 0; } }
.pix .s1 { animation: st 1.6s steps(1) infinite; } .pix .s2 { animation: st 1.6s steps(1) infinite reverse; }
@keyframes st { 0%, 49% { opacity: .9; } 50%, 100% { opacity: 0; } }
.pix .star { animation: tw 3.3s steps(1) infinite; } @keyframes tw { 0%, 70% { opacity: 1; } 71%, 100% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .pix * { animation: none !important; } }
/* Old-web accents: pixel type for small labels, dotted dividers; body stays Avenir. */
:root { --pixel: 'Silkscreen', 'Avenir Next', monospace; }
h2, .tl, .ct, .sg, .gh, nav.seg a, .hl span, .duelab, .week .dh, .cal .ch, .subnav a, details.donebox summary, .bar h1 { font-family: var(--pixel); font-weight: 400 !important; letter-spacing: .04em !important; }
h2 { font-size: 13px; } .tl, .ct, .sg, .gh, .hl span { font-size: 11px; } nav.seg a { font-size: 12px; text-transform: uppercase; }
.bar h1 { font-size: 20px; text-transform: lowercase; }
.week .dh { font-size: 10px; } .cal .ch { font-size: 10px; }
.updated { font-family: var(--pixel); font-size: 10px; letter-spacing: .04em; }
.tr + .tr, .noticed p + p { border-top-style: dotted !important; }
a.tile:active, .pl:active, .cd:active { background: var(--off); }
/* ===== Café board: a warm, dithered backdrop (cork / dark roast), thin-ruled paper notes pinned on it. ===== */
:root { --board: #e7d8bb; --board2: #e2d2b2; --note: #fbf7ee; --pin: var(--red); }
@media (prefers-color-scheme: dark) { :root { --board: #120d08; --board2: #17110b; --note: #1c1611; } }
html, body { background-color: var(--board) !important;
  background-image: repeating-conic-gradient(var(--board2) 0 25%, transparent 0 50%) !important; background-size: 6px 6px !important; }
.bar, nav.seg, .tile, .card, .noticed, .plan, .fc, .as, .topics, .list, .band, .week, .cal, .comp, .hl, .subnav, .arrows { background-color: var(--note); }
nav.seg { background-color: var(--note) !important; }
.tile, .card, .hl { position: relative; box-shadow: 2px 2px 0 rgba(0,0,0,.18); }
.tiles .tile:nth-child(odd) { transform: rotate(-.35deg); } .tiles .tile:nth-child(even) { transform: rotate(.3deg); }
.tile::before, .card::before { content: ''; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; background: var(--pin); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25), 0 1px 0 rgba(0,0,0,.3); }
.tiles .tile:nth-child(3n+2)::before { background: var(--blue); } .tiles .tile:nth-child(3n)::before { background: var(--yellow); }
.tile.wide::before { width: 46px; height: 12px; margin-left: -23px; top: -7px; background: rgba(243,234,211,.55); box-shadow: none; transform: rotate(-2deg); }
.cards .card:nth-child(2n)::before { background: var(--blue); } .cards .card:nth-child(3n)::before { background: var(--black); }
.tile.accent { border-left-width: 6px; }
section { margin-top: 26px; }
/* ===== sprites ===== */
.spr { display: inline-block; vertical-align: -2px; image-rendering: pixelated; margin-left: 4px; }
.spr .fr { opacity: 0; }
.spr.n2 .fr0 { animation: f2a 2.4s steps(1) infinite; } .spr.n2 .fr1 { animation: f2b 2.4s steps(1) infinite; }
@keyframes f2a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } } @keyframes f2b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
.spr.n3 .fr0 { animation: f3a 3s steps(1) infinite; } .spr.n3 .fr1 { animation: f3b 3s steps(1) infinite; } .spr.n3 .fr2 { animation: f3c 3s steps(1) infinite; }
@keyframes f3a { 0%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } } @keyframes f3b { 0%, 32% { opacity: 0; } 33%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } } @keyframes f3c { 0%, 65% { opacity: 0; } 66%, 100% { opacity: 1; } }
.spr.candle .fr { animation-duration: .9s !important; } .spr.cat .fr { animation-duration: 3.2s !important; } .spr.plant .fr { animation-duration: 4s !important; }
.catwrap { position: absolute; right: 14px; top: -21px; line-height: 0; }
.pix .wx .fall { animation: fall 4s linear infinite; } .pix .wx .f1 { animation-delay: -1s; } .pix .wx .f2 { animation-delay: -2s; } .pix .wx .f3 { animation-delay: -3s; }
@keyframes fall { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(.6px, 3.6px); opacity: 0; } }
.pix .wx .sun { animation: tw 3s steps(1) infinite; }

#rest { position: fixed; inset: 0; z-index: 60; background: #070b1c; opacity: 0; pointer-events: none; transition: opacity .5s; }
#rest.on { opacity: 1; pointer-events: auto; }
#rest canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; }

@keyframes hintfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
.pixbox { cursor: pointer; }

.rdots i { width: 6px; height: 6px; background: rgba(243,234,211,.3); } .rdots i.on { background: #f3ead3; }
.usetl { border: var(--rule) solid var(--ink); background: var(--note); padding: 6px 12px; }
.ub { display: grid; grid-template-columns: 64px 12px 1fr; gap: 10px; align-items: start; padding: 6px 0; }
.ub .ut, .ubr .ut { font-size: 12px; color: var(--muted); padding-top: 2px; }
.ub i { width: 12px; display: block; outline: 1.5px solid var(--ink); }
.ub small { display: block; color: var(--muted); font-size: 13px; }
.ubr { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 0 0 0 0; }
.ubr em { font-style: normal; font-size: 12px; color: var(--muted); border-left: 1.5px dotted var(--muted); padding-left: 14px; margin-left: 5px; }
.usetl .tip { border-top: var(--thin) dotted var(--ink); padding: 8px 0 4px; font-size: 13px; }
.rctl { position: absolute; left: 0; right: 0; bottom: max(40px, calc(env(safe-area-inset-bottom) + 28px)); display: flex; justify-content: center; gap: 10px; }
.rctl button { background: rgba(7,11,28,.55); color: #f3ead3; border: 1px solid rgba(243,234,211,.45); font: 11px var(--pixel); letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
.spr, .pixbox { cursor: pointer; } .spr { transition: transform .15s; } .spr:hover { transform: scale(1.25); }
.spr:active { transform: scale(.9); }
#rest canvas.smooth { image-rendering: auto; }
/* ===== Log: a kept notebook rather than a board. No boxes; one slim ruled page that runs on. ===== */
#log .topics { border: none !important; background:
  linear-gradient(to right, transparent 66px, rgba(196,71,58,.45) 66px, rgba(196,71,58,.45) 67px, transparent 67px),
  repeating-linear-gradient(to bottom, transparent 0 27px, rgba(139,111,82,.22) 27px 28px), var(--note) !important;
  box-shadow: none !important; max-width: 560px; padding: 6px 0 18px; }
#log .tg + .tg { border-top: none !important; margin-top: 14px; }
#log .th { border-bottom: none !important; padding: 8px 12px 2px 78px; font-family: var(--pixel); font-size: 11px; letter-spacing: .08em; color: var(--muted); }
#log .th i { width: 7px; height: 7px; outline: none; border-radius: 50%; }
#log .tr { grid-template-columns: 62px 1fr !important; gap: 12px !important; padding: 0 14px 0 0 !important; line-height: 28px !important; font-size: 15px; }
#log .tr + .tr { border-top: none !important; }
#log .tr .td { font-size: 10.5px; color: var(--muted); text-align: right; padding: 0 2px 0 0; line-height: 28px; white-space: nowrap; overflow: hidden; }
#log .tr b { font-weight: 600; }
#log .tr:nth-child(4n+2) span:last-child { transform: rotate(-.25deg); display: inline-block; }

@media (prefers-color-scheme: dark) { #log .topics { background:
  linear-gradient(to right, transparent 66px, rgba(194,90,76,.5) 66px, rgba(194,90,76,.5) 67px, transparent 67px),
  repeating-linear-gradient(to bottom, transparent 0 27px, rgba(203,189,155,.12) 27px 28px), #0e0b08 !important; } }

<script>
var CLASSES = ['Topology', 'Physics III', 'Phil of Sci', 'Lit Study', 'Woolf'];
var SHORT = {'Topology':'Top', 'Physics III':'Phys', 'Phil of Sci':'Phil', 'Lit Study':'Lit', 'Woolf':'Woolf'};
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function cls(c){ return CLASSES.indexOf(c) >= 0 ? 'c-' + c.replace(/ /g, '-') : 'c-other'; }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function hm(m){ var h = Math.floor(m/60), r = m%60; return h ? h + 'h' + (r ? String(r).padStart(2,'0') + 'm' : '') : r + 'm'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

var DATA = null, today = new Date(), weekStart = null;
today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
function sunday(d){ var x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }

function renderToday(){
  var t = iso(today);
  el('today').textContent = DAYS[today.getDay()] + ' ' + MON[today.getMonth()] + ' ' + today.getDate();
  var ss = DATA.sessions.filter(function(s){ return s.date === t; }).sort(function(a,b){ return a.start_min - b.start_min; });
  var total = ss.reduce(function(a,s){ return a + (s.minutes||0); }, 0);
  var band = el('band');
  if (!ss.length) band.innerHTML = '<div class="empty">No sessions yet today.</div><div class="tot"><b>0m</b><span>today</span></div>';
  else band.innerHTML = ss.map(function(s){ return '<div class="blk ' + cls(s['class']) + '" style="flex:' + Math.max(s.minutes||1, 1) + '" title="' + esc(s['class']) + '"></div>'; }).join('')
      + '<div class="tot"><b>' + hm(total) + '</b><span>today</span></div>';
  el('daysub').textContent = ss.length ? ss.length + ' session' + (ss.length > 1 ? 's' : '') : '';
  el('daylist').innerHTML = ss.map(function(s){
    return '<div class="row"><div class="sw ' + cls(s['class']) + '"></div><div class="t"><b>' + esc(s['class']) + '</b> <small>' + esc(s.start) + '–' + esc(s.in_progress ? 'now' : s.end) + '</small>' + (s.topic ? '<div class="tp">' + esc(s.topic) + '</div>' : '') + '</div><div class="m">' + hm(s.minutes||0) + '</div></div>';
  }).join('');
  el('daylist').style.display = ss.length ? '' : 'none';
}

function renderWeek(){
  var ws = iso(weekStart), we = new Date(weekStart); we.setDate(we.getDate() + 6);

function statsOf(wk, ss){
  var tot = ss.reduce(function(a,s){ return a+(s.minutes||0); },0);
  var late = ss.filter(function(s){ return s.start_min < 5*60; }).reduce(function(a,s){ return a+(s.minutes||0); },0);
  var days = {}; ss.forEach(function(s){ days[s.date]=1; });
  var by = {}; ss.forEach(function(s){ by[s['class']] = (by[s['class']]||0) + (s.minutes||0); });
  return {wk:wk, ss:ss, tot:tot, late: tot ? late/tot : 0, days:Object.keys(days).length, avg: ss.length ? tot/ss.length : 0, by:by};
}
function weekStats(wk, upTo){
  // upTo: minutes since the start of the week (Sunday 0:00); only sessions started by then count
  var ws = parse(wk);
  var ss = DATA.sessions.filter(function(s){
    if (s.week !== wk) return false;
    if (upTo == null) return true;
    var day = Math.round((parse(s.date) - ws) / 864e5);
    return day*1440 + s.start_min <= upTo;
  });
  return statsOf(wk, ss);
}
function renderTrends(){
  var now = new Date(), curWk = iso(sunday(today));

  var weeks = [];

    weeks.push({full: weekStats(wk), same: weekStats(wk, elapsed)}); }

  if (weeks.length < 2){ el('trends').innerHTML = '<p class="nz" style="padding:10px 12px">Trends appear once there are two weeks of log.</p>'; return; }
  var max = Math.max.apply(null, weeks.map(function(w){ return w.full.tot; })) || 1;
  function segs(st, faded){ return CLASSES.concat(Object.keys(st.by).filter(function(c){ return CLASSES.indexOf(c) < 0; })).filter(function(c){ return st.by[c]; })
      .map(function(c){ return '<div class="' + cls(c) + (faded ? ' fade' : '') + '" style="height:' + (100*st.by[c]/max) + '%"></div>'; }).join(''); }
  var bars = '<div class="tbars">' + weeks.map(function(w){
    var d = parse(w.full.wk), isCur = w.full.wk === iso(weekStart);
    var rest = {by:{}}; Object.keys(w.full.by).forEach(function(c){ var r = w.full.by[c] - (w.same.by[c]||0); if (r > 0) rest.by[c] = r; });
    var stack = (viewingCurrent && !isCur) ? segs(w.same, false) + segs(rest, true) : segs(w.full, false);
    var label = (viewingCurrent && !isCur) ? '<div class="tv">' + hm(w.same.tot) + '<small> of ' + hm(w.full.tot) + '</small></div>' : '<div class="tv">' + (w.full.tot ? hm(w.full.tot) : '—') + '</div>';
    return '<div class="tb' + (isCur ? ' cur' : '') + '"><div class="stack">' + stack + '</div>' + label + '<div class="tw">' + (d.getMonth()+1) + '/' + d.getDate() + '</div></div>';
  }).join('') + '</div>';
  var cur = weeks[weeks.length-1].full, prev = viewingCurrent ? weeks[weeks.length-2].same : weeks[weeks.length-2].full, prevFull = weeks[weeks.length-2].full, lines = [];
  function arrow(a, b){ return a > b ? '↑' : a < b ? '↓' : '→'; }
  if (viewingCurrent){
    var clockNow = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    lines.push('<span class="tnote">Compared with last week up to the same point: ' + DAYS[today.getDay()] + ' ' + clockNow + '. Solid = by this point; faded = the rest of that week.</span>');
    lines.push('Hours so far ' + arrow(cur.tot, prev.tot) + ' ' + hm(cur.tot) + ' vs ' + hm(prev.tot) + ' (last week went on to ' + hm(prevFull.tot) + ').');
  } else lines.push('Total ' + arrow(cur.tot, prev.tot) + ' ' + hm(cur.tot) + ' vs ' + hm(prev.tot) + '.');
  if (prev.tot){
    lines.push('Share after midnight ' + arrow(Math.round(100*cur.late), Math.round(100*prev.late)) + ' ' + Math.round(100*cur.late) + '% vs ' + Math.round(100*prev.late) + '%.');
    lines.push('Average stretch ' + arrow(Math.round(cur.avg), Math.round(prev.avg)) + ' ' + hm(Math.round(cur.avg)) + ' vs ' + hm(Math.round(prev.avg)) + '.');
  }
  lines.push('Days with study ' + arrow(cur.days, prev.days) + ' ' + cur.days + ' vs ' + prev.days + '.');
  var moved = CLASSES.map(function(c){ return [c, (cur.by[c]||0) - (prev.by[c]||0)]; }).filter(function(x){ return x[1]; }).sort(function(a,b){ return Math.abs(b[1]) - Math.abs(a[1]); });

var RANGE = 'W';
function sday(s){ var d = parse(s.date); if (s.start_min < 300) d.setDate(d.getDate()-1); return iso(d); }

function clk(m){ m = ((m % 1440) + 1440) % 1440; var h = Math.floor(m/60), mm = Math.round(m%60), ap = h < 12 ? 'AM' : 'PM'; return (h%12||12) + (mm ? ':' + String(mm).padStart(2,'0') : '') + ' ' + ap; }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dayStats(){
  var by = {};
  DATA.sessions.forEach(function(s){
    var k = sday(s), e = s.in_progress ? s.start_min : (s.end_min > s.start_min || s.start_min < 300 ? s.end_min : s.end_min + 1440);
    var o = by[k] || (by[k] = {min:0, first:1e9, last:0, n:0, longest:0, late:0, cls:{}});
    o.min += s.minutes||0; o.n++; o.longest = Math.max(o.longest, s.minutes||0);
    o.first = Math.min(o.first, nightMin(s.start_min)); o.last = Math.max(o.last, nightMin(e));
    if (s.start_min < 300) o.late += s.minutes||0;

}
function windowDays(endIso, n){ var out = [], e = parse(endIso); for (var i = n-1; i >= 0; i--) out.push(iso(addDays(e, -i))); return out; }
function agg(days, by){
  var a = {days:days.length, studied:0, min:0, n:0, first:[], last:[], longest:0, late:0, cls:{}};
  days.forEach(function(d){ var o = by[d]; if (!o) return; a.studied++; a.min += o.min; a.n += o.n; a.first.push(o.first); a.last.push(o.last); a.longest = Math.max(a.longest, o.longest); a.late += o.late;
    Object.keys(o.cls).forEach(function(c){ a.cls[c] = (a.cls[c]||0) + o.cls[c]; }); });

  a.perDay = a.min / Math.max(1, a.days); a.firstAvg = mean(a.first); a.lastAvg = mean(a.last); a.avgSess = a.n ? a.min/a.n : 0;
  return a;
}
function renderHealth(){

  else if (RANGE === 'W'){ var ws = sunday(parse(nowStudy)), n = Math.round((parse(nowStudy) - ws)/864e5) + 1;

function renderPlan(){
  // Spread each open assignment's remaining time over the days left, most urgent first.
  var nowStudy = sday({date: iso(new Date()), start_min: new Date().getHours()*60 + new Date().getMinutes()});
  var td = parse(nowStudy), by = dayStats();
  var doneToday = by[nowStudy] ? by[nowStudy].min : 0;
  var items = DATA.assignments.filter(function(a){ return !a.done && a.key && parse(a.due) >= addDays(td, -14); }).map(function(a){
    var t = typicalMinutes(a), left = Math.max(0, t.m - spentOn(a));
    var daysLeft = Math.round((parse(a.due) - td)/864e5);
    var late = daysLeft < 0, dueTonight = daysLeft === 0 || (daysLeft === 1 && a.time && /^(0?[0-9]|1[01]):\d\d AM/.test(a.time));
    var share = late ? left : left / Math.max(1, daysLeft + (a.time && /PM/.test(a.time) ? 1 : 0));
    return {a:a, left:left, daysLeft:daysLeft, late:late, today: Math.round(Math.min(left, Math.max(share, 30))/15)*15};
  }).filter(function(x){ return x.left > 10; });
  items.sort(function(x, y){ return (x.late === y.late ? 0 : x.late ? -1 : 1) || x.daysLeft - y.daysLeft; });
  var budget = 0; Object.keys(by).forEach(function(k){ budget += by[k].min; }); budget = Math.max(150, Math.min(360, budget / Math.max(1, Object.keys(by).length)));
  var plan = [], used = 0;
  items.forEach(function(x){ if (used >= budget) return; var m = Math.min(x.today, Math.max(30, budget - used)); plan.push({x:x, m:m}); used += m; });
  el('plansub').textContent = plan.length ? 'about ' + hm(Math.round(used)) + ' of work' : '';
  if (!plan.length){ el('plan').innerHTML = '<p class="nz" style="padding:10px 12px">Nothing pressing. A good day to get ahead or review.</p>'; return; }
  var tips = [];
  var exam = DATA.assignments.filter(function(a){ return !a.done && /midterm|final|exam/i.test(a.title) && parse(a.due) >= td; })[0];
  if (exam){ var ed = Math.round((parse(exam.due) - td)/864e5), seen = 0; DATA.sessions.forEach(function(s){ if (s['class'] === exam['class'] && sday(s) > iso(addDays(td, -7))) seen += s.minutes||0; });
    if (ed <= 10) tips.push(esc(exam['class']) + ' ' + esc(exam.title) + ' is in ' + ed + ' days' + (seen ? '' : ', with no ' + esc(exam['class']) + ' study in the last week') + '; working its homework counts as review.'); }
  var lastNight = by[iso(addDays(td, -1))]; if (lastNight && lastNight.last >= 1440 + 120) tips.push('Last night ran until ' + clk(lastNight.last) + '; starting earlier today would leave the hard parts for when you are freshest.');
  el('plan').innerHTML = plan.map(function(p, i){
    var a = p.x.a, why = p.x.late ? 'past due; finish first' : p.x.daysLeft === 0 ? 'due today' : p.x.daysLeft === 1 ? 'due tomorrow' + (a.time ? ' ' + a.time.replace(':00','') : '') : 'due ' + DAYS[parse(a.due).getDay()] + ' · about ' + hm(Math.round(p.x.left)) + ' left';
    return '<div class="pl" data-day="' + a.due + '"><span class="pn">' + (i+1) + '</span><i class="' + cls(a['class']) + '"></i><div><b>' + esc(a.title) + '</b> <small>' + esc(a['class']) + '</small><p>' + why + '</p></div><div class="pm">' + hm(Math.round(p.m)) + '</div></div>';
  }).join('') + (tips.length ? tips.map(function(t){ return '<p class="tip">' + t + '</p>'; }).join('') : '');
}

function renderUse(){

  });

  function clockOf(m){ var h = Math.floor(m/60) % 24, mm = m % 60, ap = h < 12 ? 'AM' : 'PM'; return (h % 12 || 12) + ':' + String(mm).padStart(2,'0') + ' ' + ap; }

}
function renderNoticed(ss){
  var out = [], ws = iso(weekStart);
  if (!ss.length){ el('noticed').innerHTML = '<p class="nz">Nothing logged this week yet.</p>'; return; }
  var total = ss.reduce(function(a,s){ return a+(s.minutes||0); }, 0);
  function clock(m){ var h=Math.floor(m/60)%24, mm=m%60, ap=h<12?'AM':'PM', hh=h%12||12; return hh+(mm?':'+String(mm).padStart(2,'0'):'')+' '+ap; }
  // when you work
  var late = ss.filter(function(s){ return s.start_min < 5*60; }), lateMin = late.reduce(function(a,s){ return a+(s.minutes||0); },0);
  var eve = ss.filter(function(s){ return s.start_min >= 18*60; }).reduce(function(a,s){ return a+(s.minutes||0); },0);
  var day = total - lateMin - eve;
  var parts = [['after midnight', lateMin], ['in the evening', eve], ['during the day', day]].sort(function(a,b){ return b[1]-a[1]; });
  out.push('Most of your work this week happened <b>' + parts[0][0] + '</b> (' + Math.round(100*parts[0][1]/total) + '%).');
  if (late.length){
    var latest = late.reduce(function(a,s){ return Math.max(a, s.in_progress ? s.start_min : s.end_min); }, 0);
    var nights = {}; late.forEach(function(s){ nights[s.date]=1; });
    out.push('You worked past midnight on <b>' + Object.keys(nights).length + (Object.keys(nights).length>1?' nights':' night') + '</b>, as late as <b>' + clock(latest) + '</b>. ' + Math.round(100*lateMin/total) + '% of the week’s hours came after midnight.');
  }
  // longest day and session
  var byDay = {}; ss.forEach(function(s){ byDay[s.date] = (byDay[s.date]||0) + (s.minutes||0); });
  var days = Object.keys(byDay), best = days.sort(function(a,b){ return byDay[b]-byDay[a]; })[0];
  var bd = parse(best);
  out.push('Your longest day was <b>' + DAYS[bd.getDay()] + '</b> with ' + hm(byDay[best]) + (days.length>1 ? ', and you studied on ' + days.length + ' of 7 days.' : '. It was the only day with logged study so far.'));
  var longest = ss.reduce(function(a,s){ return (s.minutes||0) > (a.minutes||0) ? s : a; });
  var avg = Math.round(total/ss.length);
  out.push('Your stretches averaged <b>' + hm(avg) + '</b>; the longest was ' + hm(longest.minutes) + ' of ' + longest['class'] + '.');

  var switches = 0; days.forEach(function(d){ var cs = ss.filter(function(s){return s.date===d;}).sort(function(a,b){return a.start_min-b.start_min;}); for (var i=1;i<cs.length;i++) if (cs[i]['class']!==cs[i-1]['class']) switches++; });
  if (switches) out.push('You switched between classes <b>' + switches + (switches>1?' times':' time') + '</b> within a day, rather than staying on one subject.');
  // balance
  var by = {}; ss.forEach(function(s){ by[s['class']] = (by[s['class']]||0) + (s.minutes||0); });
  var top = Object.keys(by).sort(function(a,b){ return by[b]-by[a]; })[0];
  if (by[top]/total >= .5) out.push('<b>' + top + '</b> took ' + Math.round(100*by[top]/total) + '% of your time.');
  // classes not touched lately, and what is coming for them
  var lastSeen = {}; DATA.sessions.forEach(function(s){ if (s.date <= iso(today) && (!lastSeen[s['class']] || s.date > lastSeen[s['class']])) lastSeen[s['class']] = s.date; });
  CLASSES.forEach(function(c){
    var next = DATA.assignments.filter(function(a){ return a['class']===c && !a.done && a.due >= iso(today); })[0];
    var ago = lastSeen[c] ? Math.round((today - parse(lastSeen[c]))/864e5) : null;
    if ((ago === null || ago >= 5) && next) out.push('<b>' + c + '</b>: ' + (ago === null ? 'no logged time yet' : 'last studied ' + ago + ' days ago') + ', with ' + esc(next.title) + ' due ' + DAYS[parse(next.due).getDay()] + '.');
  });
  // compared with last week
  var prev = new Date(weekStart); prev.setDate(prev.getDate()-7); var pw = iso(prev);
  var prevTot = DATA.sessions.filter(function(s){ return s.week === pw; }).reduce(function(a,s){ return a+(s.minutes||0); },0);
  if (prevTot) out.push('So far ' + hm(total) + ' this week, against ' + hm(prevTot) + ' all of last week.');
  el('noticed').innerHTML = out.map(function(t){ return '<p>' + t + '</p>'; }).join('');
}
function renderComp(ss){
  var by = {}; ss.forEach(function(s){ by[s['class']] = (by[s['class']]||0) + (s.minutes||0); });
  var items = Object.keys(by).map(function(k){ return {c:k, m:by[k]}; }).sort(function(a,b){ return b.m - a.m; });
  var total = items.reduce(function(a,b){ return a + b.m; }, 0);
  el('compsub').textContent = total ? hm(total) + ' ' + (el('compsub').dataset.when || 'this week') : '';
  var box = el('comp'); box.innerHTML = '';
  if (!total){ box.innerHTML = '<div style="padding:14px;color:var(--muted)">No sessions this week.</div>'; }
  // Slice-and-dice: alternate vertical and horizontal cuts, largest first.
  function lay(list, x, y, w, h, vert){
    if (!list.length) return;
    if (list.length === 1){ place(list[0], x, y, w, h); return; }
    var sum = list.reduce(function(a,b){ return a + b.m; }, 0), first = list[0], f = first.m / sum;
    if (vert){ place(first, x, y, w*f, h); lay(list.slice(1), x + w*f, y, w*(1-f), h, !vert); }
    else { place(first, x, y, w, h*f); lay(list.slice(1), x, y + h*f, w, h*(1-f), !vert); }
  }

// ===== Scene 4: "The Waves" — a pastel sea under a sun that crosses the sky, a nod to Woolf's interludes.

  var hz = Math.round(H*0.55), seas = ['#7fb7d9','#6aa3cc','#5a8fbf','#4b7bb0','#3f6aa0'];
  for (var y = hz; y < H; y++){ var b = Math.min(seas.length - 1, Math.floor((y - hz)/(H - hz)*seas.length)); ctx.fillStyle = seas[b]; ctx.fillRect(0, y, W, 1); }

}

// ===== Rest screen: a pixel lighthouse on a shore at night. Swipe right to open; tap or swipe left to close.
(function(){
  var rest = document.getElementById('rest'), cv = document.getElementById('restc'), ctx = cv.getContext('2d'), raf = null, W, H, stars = [], t0;
  function size(){ var sc = (typeof SCENES !== 'undefined') ? SCENES[scene] : 'lighthouse';
    cv.classList.toggle('smooth', sc === 'wave');
    if (sc === 'wave'){ W = Math.round(innerWidth*devicePixelRatio); H = Math.round(innerHeight*devicePixelRatio); cv.width = W; cv.height = H; return; }
    H = sc === 'city' ? 440 : sc === 'woolf' ? 180 : 160; W = Math.max(80, Math.round(H * innerWidth / innerHeight)); cv.width = W; cv.height = H;
    stars = []; var seed = 7; function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < W*0.9; i++) stars.push([Math.floor(rnd()*W), Math.floor(rnd()*H*0.55), rnd()*6.28, rnd() < .2]); }

    for (var y = 0; y < hz; y++){ var f = y / hz * (bands.length-1), i = Math.floor(f), fr = f - i;
      for (var x = 0; x < W; x++) px(x, y, ((x + y) % 2 === 0 && fr > .5) ? bands[Math.min(i+1, bands.length-1)] : bands[i]); }

    // moon
    var mx = Math.round(W*0.22), my = Math.round(H*0.14);
    for (var y = -6; y <= 6; y++) for (var x = -6; x <= 6; x++){ var d = x*x + y*y; if (d <= 30) px(mx+x, my+y, (x-2)*(x-2) + (y+1)*(y+1) <= 22 && d > 12 ? '#f3ead3' : d <= 30 ? '#f6efdf' : ''); }
    for (var y = -6; y <= 6; y++) for (var x = -6; x <= 6; x++){ if (x*x+y*y <= 30 && (x+3)*(x+3) + (y-1)*(y-1) <= 6) px(mx+x, my+y, '#d9cdb0'); }
    // sea: gentle horizontal swells and a sparse moon path
    for (var y = hz; y < H; y++){ var depth = (y - hz) / (H - hz);
      for (var x = 0; x < W; x++){
        var c = depth < .12 ? '#25365f' : depth < .4 ? '#1d2c52' : '#172446';
        var w = Math.sin(x*0.18 + t*1.2 + Math.sin(y*0.55)*2.2 + y*0.3);
        if (y % 2 === 0 && w > .93) c = '#4d77b3'; else if (y % 2 === 0 && w > .8) c = '#2f5f9e';
        if (Math.abs(x - mx) < 2 + depth*5 && y % 2 === 1 && Math.sin(x*1.7 + t*2.5 + y*0.8) > .55) c = '#d9cdb0';
        px(x, y, c); } }
    // rocky point the lighthouse stands on, sea in front of it
    var rockBot = base + 9;
    for (var x = lx - 20; x < W; x++){ var top = base - Math.round(3 + 2*Math.sin(x*0.5) + (x > lx-6 && x < lx+7 ? 3 : 0));
      var bot = rockBot - Math.round(Math.max(0, (lx - 20 + 8 - x)) * .4);
      for (var y = top; y < bot; y++) px(x, y, y === top ? '#5a412f' : ((x+y)%3 ? '#241f1a' : '#30281f')); }
    for (var x = lx - 24; x < W; x++){ var fy = rockBot + Math.round(1.2*Math.sin(t*2 + x*0.35)); if (Math.sin(t*2.4 + x*0.6) > .1) px(x, fy, '#f6efdf'); if (Math.sin(t*1.7 + x*0.9) > .6) px(x, fy + 1, '#9aa9c8'); }
    // lighthouse: tapered tower with red bands, gallery, lantern, roof
    var top = base - 44;
    for (var y = top + 10; y < base - 6; y++){ var k = (y - top - 10) / (base - 16 - top), hw = Math.round(2 + k*2.5);
      for (var x = -hw; x <= hw; x++) px(lx + x, y, (Math.floor((y - top) / 6) % 2) ? '#c4473a' : '#f6efdf'); px(lx + hw, y, '#b9b0a0'); }
    for (var x = -4; x <= 4; x++) px(lx + x, top + 9, '#241f1a');
    for (var y = top + 4; y < top + 9; y++) for (var x = -2; x <= 2; x++) px(lx + x, y, (Math.abs(x) === 2) ? '#241f1a' : '#ffe7a1');
    for (var x = -3; x <= 3; x++) px(lx + x, top + 3, '#241f1a'); for (var x = -2; x <= 2; x++) px(lx + x, top + 2, '#241f1a'); px(lx, top + 1, '#241f1a');

  document.addEventListener('touchend', function(e){ if (sx === null) return; var tt = e.changedTouches[0], dx = tt.clientX - sx, dy = tt.clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2*Math.abs(dy)){ if (dx > 0){ if (!rest.classList.contains('on')){ if (!document.querySelector('.sheet.on')) open(); } else if (scene < SCENES.length - 1) show(scene + 1); } else if (dx < 0 && rest.classList.contains('on')){ if (scene > 0) show(scene - 1); else close(); } } }, {passive:true});
  rest.addEventListener('click', function(e){ var b = e.target.closest('[data-go]'); if (!b) return; e.stopPropagation(); var g = b.dataset.go;
    if (g === 'x') close(); else if (g === 'n') show((scene + 1) % SCENES.length); else show((scene - 1 + SCENES.length) % SCENES.length); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  window.openRest = open;
  addEventListener('resize', function(){ if (rest.classList.contains('on')) size(); });
})();

document.addEventListener('click', function(e){
  var sp = e.target.closest('.spr, .pixbox'); if (!sp || !window.openRest) return;
  e.preventDefault(); e.stopPropagation();
  var big = sp.classList.contains('sine') ? 2 : sp.classList.contains('woolfw') ? 3 : (sp.classList.contains('glass') || sp.classList.contains('plant')) ? 1 : 0;   // hourglass, plant -> the city of deadlines and numbers; lamp, cat, candle -> the lighthouse
  openRest(big);
}, true);
fetch('data.json?' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
  DATA = d; weekStart = sunday(today); render();
}).catch(function(){ el('band').innerHTML = '<div class="empty">Could not load data.json.</div>'; });
